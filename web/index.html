<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GRF Coach - 全方位教练</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { light: '#38bdf8', DEFAULT: '#0ea5e9', dark: '#0284c7' },
                        dark: { bg: '#0f172a', card: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-20">

    <!-- 启动屏幕 -->
    <div id="splash" class="fixed inset-0 bg-dark-bg flex flex-col items-center justify-center z-50 text-white transition-opacity duration-300">
        <svg class="w-20 h-20 text-brand animate-pulse mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        <h1 class="text-2xl font-bold tracking-widest text-brand">GRF COACH</h1>
        <p class="text-slate-400 mt-2 text-sm">全方位私人教练</p>
    </div>

    <!-- 登录/注册视图 -->
    <div id="view-auth" class="hidden fixed inset-0 bg-dark-bg z-40 flex flex-col justify-center px-6">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-white mb-2">欢迎回来</h2>
            <p class="text-slate-400">数据驱动你的每一次进步</p>
        </div>
        <form id="auth-form" class="space-y-4">
            <div>
                <input type="text" id="auth-user" placeholder="用户名" required class="w-full bg-dark-card text-white px-4 py-3 rounded-xl border border-slate-700 focus:border-brand outline-none transition">
            </div>
            <div>
                <input type="password" id="auth-pass" placeholder="密码" required class="w-full bg-dark-card text-white px-4 py-3 rounded-xl border border-slate-700 focus:border-brand outline-none transition">
            </div>
            <button type="submit" id="auth-btn" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-xl transition shadow-lg shadow-brand/30">登录</button>
            <div class="text-center mt-4">
                <button type="button" id="auth-toggle" class="text-brand text-sm hover:underline">没有账号？注册一个</button>
            </div>
            <p id="auth-error" class="text-red-400 text-sm text-center hidden"></p>
        </form>
    </div>

    <!-- 主应用容器 -->
    <div id="app" class="hidden max-w-lg mx-auto">
        
        <!-- 顶部导航条 -->
        <header class="bg-white sticky top-0 z-30 shadow-sm px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-dark-bg flex items-center gap-2">
                <svg class="w-6 h-6 text-brand" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
                GRF
            </h1>
            <button id="btn-logout" class="text-sm text-slate-400 hover:text-slate-600">退出</button>
        </header>

        <!-- 各个页面视图 -->
        <main id="main-content" class="p-4 space-y-4">
            <!-- 首页 Dashboard -->
            <section id="tab-dashboard" class="tab-content space-y-4">
                <!-- 问候区 -->
                <div class="bg-gradient-to-br from-brand-dark to-brand rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                    <div class="relative z-10">
                        <p class="text-sm opacity-90" id="dash-greeting">你好</p>
                        <h2 class="text-2xl font-bold mt-1 mb-4" id="dash-goal">目标：减脂增肌</h2>
                        <div class="flex gap-4">
                            <div class="bg-white/20 rounded-lg p-2 flex-1 text-center backdrop-blur-sm">
                                <div class="text-xs opacity-80">本周跑量</div>
                                <div class="text-xl font-bold" id="dash-run-km">0 <span class="text-xs font-normal">km</span></div>
                            </div>
                            <div class="bg-white/20 rounded-lg p-2 flex-1 text-center backdrop-blur-sm">
                                <div class="text-xs opacity-80">力量训练</div>
                                <div class="text-xl font-bold" id="dash-strength">0 <span class="text-xs font-normal">次</span></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 核心数据卡 -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                        <div class="text-slate-400 text-xs mb-1">最新体重</div>
                        <div class="text-2xl font-bold text-slate-700" id="dash-weight">-- <span class="text-sm font-normal text-slate-400">kg</span></div>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                        <div class="text-slate-400 text-xs mb-1">体脂率</div>
                        <div class="text-2xl font-bold text-slate-700" id="dash-bodyfat">-- <span class="text-sm font-normal text-slate-400">%</span></div>
                    </div>
                </div>

                <!-- AI 教练入口 -->
                <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 flex items-start gap-3 cursor-pointer hover:bg-indigo-100 transition" onclick="switchTab('coach')">
                    <div class="bg-indigo-500 rounded-full p-2 text-white flex-shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-indigo-900 text-sm">问教练</h3>
                        <p class="text-xs text-indigo-700 mt-1">综合跑步、力量、饮食数据，给你具体建议</p>
                    </div>
                </div>
            </section>

            <!-- 跑步视图 -->
            <section id="tab-run" class="tab-content hidden space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold">跑步数据</h2>
                    <label class="bg-brand text-white text-xs px-3 py-1.5 rounded-full cursor-pointer hover:bg-brand-dark transition">
                        上传 TCX/XML
                        <input type="file" id="run-upload" class="hidden" accept=".tcx,.gpx,.xml,.csv" multiple>
                    </label>
                </div>
                <div id="run-list" class="space-y-3">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- 力量训练视图 -->
            <section id="tab-strength" class="tab-content hidden space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold">力量训练</h2>
                    <button class="text-brand text-sm font-medium" onclick="openTemplateSelector()">记录今日训练</button>
                </div>
                
                <!-- 肌肉覆盖图 -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-600 mb-3">近 7 天肌肉容量</h3>
                    <div class="h-48">
                        <canvas id="strength-chart"></canvas>
                    </div>
                </div>
                
                <div id="workout-list" class="space-y-3 mt-4">
                    <!-- 历史记录 -->
                </div>
            </section>

            <!-- 饮食视图 -->
            <section id="tab-nutrition" class="tab-content hidden space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-bold">营养与饮食</h2>
                    <label class="bg-brand text-white text-xs px-3 py-1.5 rounded-full cursor-pointer hover:bg-brand-dark transition">
                        拍照识餐
                        <input type="file" id="meal-upload" class="hidden" accept="image/*" capture="environment">
                    </label>
                </div>
                
                <!-- 营养目标 -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-600 mb-3">今日宏量目标</h3>
                    <div class="grid grid-cols-4 gap-2 text-center text-xs">
                        <div class="bg-slate-50 p-2 rounded-lg">
                            <div class="text-slate-400">热量</div>
                            <div class="font-bold text-slate-700 mt-1" id="mac-kcal">--</div>
                        </div>
                        <div class="bg-blue-50 p-2 rounded-lg">
                            <div class="text-blue-400">蛋白</div>
                            <div class="font-bold text-blue-700 mt-1" id="mac-p">--g</div>
                        </div>
                        <div class="bg-amber-50 p-2 rounded-lg">
                            <div class="text-amber-500">碳水</div>
                            <div class="font-bold text-amber-700 mt-1" id="mac-c">--g</div>
                        </div>
                        <div class="bg-rose-50 p-2 rounded-lg">
                            <div class="text-rose-400">脂肪</div>
                            <div class="font-bold text-rose-700 mt-1" id="mac-f">--g</div>
                        </div>
                    </div>
                </div>
                
                <div id="meal-list" class="space-y-3">
                    <!-- 饮食记录 -->
                </div>
            </section>

            <!-- AI 教练视图 -->
            <section id="tab-coach" class="tab-content hidden h-[calc(100vh-140px)] flex flex-col">
                <div class="flex gap-2 mb-3 overflow-x-auto pb-1 shrink-0">
                    <button id="btn-weekly" class="shrink-0 bg-brand text-white text-xs px-3 py-2 rounded-xl font-medium">📊 生成周报</button>
                    <button id="btn-plan" class="shrink-0 bg-white border border-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl font-medium">📅 下周计划</button>
                    <button id="btn-run-advice" class="shrink-0 bg-white border border-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl font-medium">🏃 跑步分析</button>
                    <button id="btn-diet-advice" class="shrink-0 bg-white border border-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl font-medium">🍽 饮食调整</button>
                </div>
                <div class="flex-1 overflow-y-auto space-y-4 mb-4" id="chat-box">
                    <div class="text-center text-xs text-slate-400 my-4">已接入你的全部训练数据</div>
                    <!-- 对话气泡动态生成 -->
                </div>
                <div class="bg-white p-2 rounded-2xl shadow-md border border-slate-100 flex items-center gap-2 sticky bottom-20">
                    <input type="text" id="chat-input" placeholder="问教练问题..." class="flex-1 bg-transparent px-3 py-2 outline-none text-sm">
                    <button id="chat-send" class="bg-brand text-white p-2 rounded-xl hover:bg-brand-dark transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </section>
        </main>

        <!-- 底部导航栏 -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30 pb-safe">
            <div class="flex justify-around items-center h-16 max-w-lg mx-auto">
                <button class="nav-btn flex flex-col items-center justify-center w-full h-full text-brand" data-target="dashboard">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span class="text-[10px]">首页</span>
                </button>
                <button class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400" data-target="run">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    <span class="text-[10px]">跑步</span>
                </button>
                <button class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400" data-target="strength">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7c0-2.21-3.582-4-8-4s-8 1.79-8 4zm0 0c0 2.21 3.582 4 8 4s8-1.79 8-4"></path></svg>
                    <span class="text-[10px]">力量</span>
                </button>
                <button class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400" data-target="nutrition">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <span class="text-[10px]">饮食</span>
                </button>
                <button class="nav-btn flex flex-col items-center justify-center w-full h-full text-slate-400" data-target="coach">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    <span class="text-[10px]">教练</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- 弹窗：模板选择 -->
    <div id="modal-template" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[85vh] flex flex-col">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-lg">选择训练模板</h3>
                <button class="text-slate-400" onclick="document.getElementById('modal-template').classList.add('hidden')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-3" id="template-list">
                <!-- 动态 -->
            </div>
        </div>
    </div>
    
    <!-- 弹窗：填写配重 -->
    <div id="modal-log" class="fixed inset-0 bg-black/50 z-50 hidden flex flex-col">
        <div class="bg-white w-full max-w-lg mt-auto rounded-t-2xl max-h-[90vh] flex flex-col h-full sm:h-auto sm:mt-auto">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-bold text-lg text-brand-dark" id="log-title">填写训练数据</h3>
                <button class="text-slate-400" onclick="document.getElementById('modal-log').classList.add('hidden')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-4" id="log-items">
                <!-- 动态渲染动作列表 -->
            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                <button id="btn-save-log" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-xl transition shadow-lg shadow-brand/30">保存并生成记录</button>
            </div>
        </div>
    </div>

    <!-- 弹窗：识别结果确认 -->
    <div id="modal-meal" class="fixed inset-0 bg-black/50 z-50 hidden flex flex-col">
        <div class="bg-white w-full max-w-lg mt-auto rounded-t-2xl max-h-[90vh] flex flex-col h-full sm:h-auto sm:mt-auto">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-bold text-lg text-brand-dark">识别结果确认</h3>
                <button class="text-slate-400" onclick="document.getElementById('modal-meal').classList.add('hidden')">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-4" id="meal-result-items">
                <!-- 动态 -->
            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                <button id="btn-save-meal" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 rounded-xl transition shadow-lg shadow-brand/30">确认并记录</button>
            </div>
        </div>
    </div>

    <script src="/assets/app.js"></script>
</body>
</html>
